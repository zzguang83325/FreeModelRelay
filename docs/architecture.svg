<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-labelledby="ttl desc">
  <title id="ttl">FreeModelRelay 架构总览</title>
  <desc id="desc">客户端通过 OpenAI Chat、Anthropic Messages、OpenAI Responses 三种协议接入本地网关，网关按请求中的 model 字段路由到 opencode zen、Cline、WorkBuddy、WorkBuddy AI、Qoder、Trae 六个上游来源。</desc>

  <style>
    .f  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t  { font-size: 14px; font-weight: 500; }
    .s  { font-size: 12px; font-weight: 400; }

    .client-box { fill: #E6F1FB; stroke: #378ADD; }
    .client-t   { fill: #0C447C; }
    .client-s   { fill: #185FA5; }

    .gw-box     { fill: #E1F5EE; stroke: #1D9E75; }
    .gw-t       { fill: #085041; }
    .gw-s       { fill: #0F6E56; }
    .pill       { fill: #FFFFFF; stroke: #5DCAA5; }
    .pill-t     { fill: #0F6E56; }

    .up-box     { fill: #F1EFE8; stroke: #888780; }
    .up-t       { fill: #2C2C2A; }
    .up-s       { fill: #5F5E5A; }

    .edge       { fill: none; stroke: #888780; stroke-width: 1.5; }

    @media (prefers-color-scheme: dark) {
      .client-box { fill: #0C447C; stroke: #85B7EB; }
      .client-t   { fill: #B5D4F4; }
      .client-s   { fill: #85B7EB; }

      .gw-box     { fill: #085041; stroke: #5DCAA5; }
      .gw-t       { fill: #9FE1CB; }
      .gw-s       { fill: #5DCAA5; }
      .pill       { fill: #04342C; stroke: #5DCAA5; }
      .pill-t     { fill: #9FE1CB; }

      .up-box     { fill: #444441; stroke: #B4B2A9; }
      .up-t       { fill: #D3D1C7; }
      .up-s       { fill: #B4B2A9; }

      .edge       { stroke: #B4B2A9; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="client-box" x="40" y="158" width="140" height="64" rx="8" stroke-width="0.5"/>
  <text class="f t client-t" x="110" y="180" text-anchor="middle" dominant-baseline="central">客户端</text>
  <text class="f s client-s" x="110" y="200" text-anchor="middle" dominant-baseline="central">Claude Code · Cursor</text>

  <path class="edge" d="M180 190 L236 189" marker-end="url(#arrow)"/>

  <rect class="gw-box" x="240" y="108" width="180" height="160" rx="12" stroke-width="0.5"/>
  <text class="f t gw-t" x="330" y="130" text-anchor="middle" dominant-baseline="central">FreeModelRelay</text>
  <text class="f s gw-s" x="330" y="148" text-anchor="middle" dominant-baseline="central">127.0.0.1:9999</text>

  <rect class="pill" x="256" y="164" width="148" height="24" rx="6" stroke-width="0.5"/>
  <text class="f s pill-t" x="330" y="176" text-anchor="middle" dominant-baseline="central">OpenAI Chat</text>
  <rect class="pill" x="256" y="194" width="148" height="24" rx="6" stroke-width="0.5"/>
  <text class="f s pill-t" x="330" y="206" text-anchor="middle" dominant-baseline="central">Anthropic Messages</text>
  <rect class="pill" x="256" y="224" width="148" height="24" rx="6" stroke-width="0.5"/>
  <text class="f s pill-t" x="330" y="236" text-anchor="middle" dominant-baseline="central">OpenAI Responses</text>

  <path class="edge" d="M420 188 C460 188 460 50 496 50" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 188 C460 188 460 104 496 104" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 188 C460 188 460 158 496 158" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 188 C460 188 460 212 496 212" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 188 C460 188 460 266 496 266" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 188 C460 188 460 320 496 320" marker-end="url(#arrow)"/>

  <rect class="up-box" x="500" y="28" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="42" text-anchor="middle" dominant-baseline="central">opencode zen</text>
  <text class="f s up-s" x="570" y="58" text-anchor="middle" dominant-baseline="central">匿名免费额度</text>

  <rect class="up-box" x="500" y="82" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="96" text-anchor="middle" dominant-baseline="central">Cline</text>
  <text class="f s up-s" x="570" y="112" text-anchor="middle" dominant-baseline="central">多账号轮询</text>

  <rect class="up-box" x="500" y="136" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="150" text-anchor="middle" dominant-baseline="central">WorkBuddy</text>
  <text class="f s up-s" x="570" y="166" text-anchor="middle" dominant-baseline="central">中国版 · 积分</text>

  <rect class="up-box" x="500" y="190" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="204" text-anchor="middle" dominant-baseline="central">WorkBuddy AI</text>
  <text class="f s up-s" x="570" y="220" text-anchor="middle" dominant-baseline="central">国际版 · 积分</text>

  <rect class="up-box" x="500" y="244" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="258" text-anchor="middle" dominant-baseline="central">Qoder</text>
  <text class="f s up-s" x="570" y="274" text-anchor="middle" dominant-baseline="central">阿里 · PAT 令牌</text>

  <rect class="up-box" x="500" y="298" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="312" text-anchor="middle" dominant-baseline="central">Trae</text>
  <text class="f s up-s" x="570" y="328" text-anchor="middle" dominant-baseline="central">CN 区 · 积分</text>
</svg>
