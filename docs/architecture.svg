<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="680" height="344" role="img" aria-labelledby="ttl desc">
  <title id="ttl">FreeModelRelay 架构总览</title>
  <desc id="desc">客户端通过 OpenAI Chat、Anthropic Messages、OpenAI Responses 三种协议接入本地网关，网关按请求中的 model 字段路由到 opencode zen、Cline、WorkBuddy、WorkBuddy AI、Qoder 五个上游来源。</desc>

  <style>
    .f  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t  { font-size: 14px; font-weight: 500; }
    .s  { font-size: 12px; font-weight: 400; }

    .client-box { fill: #E6F1FB; stroke: #378ADD; }
    .client-t   { fill: #0C447C; }
    .client-s   { fill: #185FA5; }

    .gw-box     { fill: #E1F5EE; stroke: #1D9E75; }
    .gw-t       { fill: #085041; }
    .gw-s       { fill: #0F6E56; }
    .pill       { fill: #FFFFFF; stroke: #5DCAA5; }
    .pill-t     { fill: #0F6E56; }

    .up-box     { fill: #F1EFE8; stroke: #888780; }
    .up-t       { fill: #2C2C2A; }
    .up-s       { fill: #5F5E5A; }

    .edge       { fill: none; stroke: #888780; stroke-width: 1.5; }

    @media (prefers-color-scheme: dark) {
      .client-box { fill: #0C447C; stroke: #85B7EB; }
      .client-t   { fill: #B5D4F4; }
      .client-s   { fill: #85B7EB; }

      .gw-box     { fill: #085041; stroke: #5DCAA5; }
      .gw-t       { fill: #9FE1CB; }
      .gw-s       { fill: #5DCAA5; }
      .pill       { fill: #04342C; stroke: #5DCAA5; }
      .pill-t     { fill: #9FE1CB; }

      .up-box     { fill: #444441; stroke: #B4B2A9; }
      .up-t       { fill: #D3D1C7; }
      .up-s       { fill: #B4B2A9; }

      .edge       { stroke: #B4B2A9; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="client-box" x="40" y="150" width="140" height="64" rx="8" stroke-width="0.5"/>
  <text class="f t client-t" x="110" y="172" text-anchor="middle" dominant-baseline="central">客户端</text>
  <text class="f s client-s" x="110" y="192" text-anchor="middle" dominant-baseline="central">Claude Code · Cursor</text>

  <path class="edge" d="M180 182 L236 181" marker-end="url(#arrow)"/>

  <rect class="gw-box" x="240" y="100" width="180" height="160" rx="12" stroke-width="0.5"/>
  <text class="f t gw-t" x="330" y="122" text-anchor="middle" dominant-baseline="central">FreeModelRelay</text>
  <text class="f s gw-s" x="330" y="140" text-anchor="middle" dominant-baseline="central">127.0.0.1:9999</text>

  <rect class="pill" x="256" y="156" width="148" height="24" rx="6" stroke-width="0.5"/>
  <text class="f s pill-t" x="330" y="168" text-anchor="middle" dominant-baseline="central">OpenAI Chat</text>
  <rect class="pill" x="256" y="186" width="148" height="24" rx="6" stroke-width="0.5"/>
  <text class="f s pill-t" x="330" y="198" text-anchor="middle" dominant-baseline="central">Anthropic Messages</text>
  <rect class="pill" x="256" y="216" width="148" height="24" rx="6" stroke-width="0.5"/>
  <text class="f s pill-t" x="330" y="228" text-anchor="middle" dominant-baseline="central">OpenAI Responses</text>

  <path class="edge" d="M420 180 C460 180 460 62 496 62" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 180 C460 180 460 122 496 122" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 180 L496 182" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 180 C460 180 460 242 496 242" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 180 C460 180 460 302 496 302" marker-end="url(#arrow)"/>

  <rect class="up-box" x="500" y="40" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="54" text-anchor="middle" dominant-baseline="central">opencode zen</text>
  <text class="f s up-s" x="570" y="70" text-anchor="middle" dominant-baseline="central">匿名免费额度</text>

  <rect class="up-box" x="500" y="100" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="114" text-anchor="middle" dominant-baseline="central">Cline</text>
  <text class="f s up-s" x="570" y="130" text-anchor="middle" dominant-baseline="central">多账号轮询</text>

  <rect class="up-box" x="500" y="160" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="174" text-anchor="middle" dominant-baseline="central">WorkBuddy</text>
  <text class="f s up-s" x="570" y="190" text-anchor="middle" dominant-baseline="central">中国版 · 积分</text>

  <rect class="up-box" x="500" y="220" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="234" text-anchor="middle" dominant-baseline="central">WorkBuddy AI</text>
  <text class="f s up-s" x="570" y="250" text-anchor="middle" dominant-baseline="central">国际版 · 积分</text>

  <rect class="up-box" x="500" y="280" width="140" height="44" rx="8" stroke-width="0.5"/>
  <text class="f t up-t" x="570" y="294" text-anchor="middle" dominant-baseline="central">Qoder</text>
  <text class="f s up-s" x="570" y="310" text-anchor="middle" dominant-baseline="central">阿里 · PAT 令牌</text>
</svg>
